method: probed
source: >-
  Direct HTTP probes of the /.well-known/ discovery surface on every Landbase host reachable from
  apis.yml and the documentation (api.landbase.com — the platform gateway named by
  LANDBASE_PLATFORM_API_URL; www.landbase.com; docs.landbase.com; platform.landbase.com;
  gtm.landbase.com; cli.landbase.com). Status codes are what each path really returned on
  2026-08-23.
description: >-
  Two real documents were found, both on the API gateway api.landbase.com:
  /.well-known/openid-configuration and the /.well-known/jwks.json it points at. They are the only
  machine-readable artifacts Landbase serves anywhere on its own infrastructure, and they are served
  from behind the Cloudflare bot challenge that answers 403 for every other path on that host — the
  /.well-known/ prefix is evidently allowlisted. The discovery document is minimal: it carries
  issuer, jwks_uri and id_token_signing_alg_values_supported only, and omits every endpoint an OIDC
  relying party needs (authorization_endpoint, token_endpoint, response_types_supported), so it is
  not an OIDC-conformant discovery document — see conformance/landbase-conformance.yml.
  gtm.landbase.com is a single-page app that answers 200 with an HTML shell for every /.well-known/
  path; those are recorded as misses, not documents. www.landbase.com answers 404 with an explicit
  "Invalid .well-known request" body for the whole prefix.
hosts:
