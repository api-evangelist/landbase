description: >-
  These are PROVIDER-AUTHORED Agent Skills, not skills API Evangelist generated. Landbase publishes
  no OpenAPI, so these skill packages — with their frontmatter name/description/when_to_use, their
  concrete landbase-cli invocations, and their supporting references and scripts — are the closest
  thing Landbase ships to a machine-readable contract, and they are the surface Claude Code and
  Codex actually consume. Four are end-to-end "recipes" (ICP capture, lookalike expansion, prospect
  builder, TAM mapping); the rest are per-tool skills covering search, match, enrichment, dataset
  pipelines, qualification, imports, and email/LinkedIn campaigns. Landbase also ships a Claude Code
  plugin (`landbase-cli config permissions`) exposing /landbase-cli:search, /landbase-cli:auth and
  /landbase-cli:setup.
