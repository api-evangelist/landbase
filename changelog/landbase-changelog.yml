generated: '2026-08-23'
method: probed
source: >-
  https://cli.landbase.com/latest/version.txt and the per-release
  https://cli.landbase.com/v<version>/notice.json documents, cross-referenced against the object
  LastModified timestamps in the public release-bucket listing at https://cli.landbase.com/.
description: >-
  Landbase publishes no changelog page on its website or in its documentation. What it does publish
  is a dated, machine-readable release notice per CLI version — a JSON document carrying `version`,
  a `highlights` array and a `notes_url` — served alongside every binary in the release bucket. The
  CLI reads latest/notice.json itself to surface an update prompt. That makes this the provider's
  real, current, machine-readable change record even though it is not presented as a changelog, and
  it covers only the client; there is no change record for the api.landbase.com gateway. Dates come
  from the release bucket's own object listing, not from the notices, which carry no date field.
docs: https://cli.landbase.com/latest/notice.json
versioning:
  scheme: semver (pre-1.0)
  artifact: landbase-cli
  current: 0.40.0
  current_released: '2026-08-14'
  first_recorded: '2026-04-20'
  first_recorded_version: 0.2.0
  release_count: 53
  cadence: >-
    53 releases in roughly four months, several on the same day — an actively developed client with
    no stated release cadence or support window.
  detail: lifecycle/landbase-lifecycle.yml
gaps:
  - >-
    No breaking-change flag. The notice format has `version` and `highlights` only; nothing marks a
    change as breaking, additive or a fix, so a consumer cannot filter for the ones that will break
    them. Breaking changes do happen — v0.31.0 retired the experimental tam_mapping_v1 agent and
    renamed tam_mapping_v2 to tam_map_creator in the same release.
  - >-
    Releases before v0.6.1 (2026-05-26) ship no notice.json at all, so the earliest 15 versions have
    binaries and checksums but no published description of what changed.
  - >-
    Highlights are raw commit subjects, including internal issue keys (VIBE-1972, VIBE-2164) and
    pull-request numbers pointing at a repository the public cannot read.
