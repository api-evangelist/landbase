aid: landbase
name: Landbase
description: >-
  Landbase is a Palo Alto, California go-to-market (GTM) data and agentic-AI company whose platform
  builds, qualifies, enriches and activates B2B audiences from natural-language requests. Its
  GTM-1/GTM-2 Omni models sit behind a B2B database of 300M+ contacts with 1,500+ enrichment fields,
  an agentic search surface, lookalike expansion, AI lead qualification, and email/LinkedIn outbound
  campaign execution. Landbase's programmable surface is deliberately agent-first rather than
  REST-first: the documented client is `landbase-cli`, a self-updating binary distributed from
  cli.landbase.com that talks to the cloud gateway at api.landbase.com, returns JSON on stdout and
  stable error codes on stderr, and ships a library of provider-authored Agent Skills for Claude Code
  and Codex. No OpenAPI description of the gateway is published; the gateway itself sits behind a
  Cloudflare bot challenge on every path except /.well-known/.
