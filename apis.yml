apis:
- aid: landbase:landbase-platform-api
  name: Landbase Platform API
  description: >-
    The Landbase cloud gateway that landbase-cli calls in platform mode. It backs natural-language
    audience search and agent runs, dataset upload/lineage/download, record match, synchronous
    person/company enrichment, asynchronous contact (email/phone) enrichment, dataset workflows
    (onboard, match, enrich, publish, sketch, transform, dedupe, qualify), account onboarding,
    contact import by tag, and email/LinkedIn campaign creation and launch. Landbase publishes no
    OpenAPI or other machine-readable description of this gateway; the command surface, error-code
    registry, output schemas and field reference are documented in prose for the CLI instead.
  humanURL: https://www.landbase.com/docs
  baseURL: https://api.landbase.com
