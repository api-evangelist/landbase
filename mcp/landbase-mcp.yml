  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
probes:
  - {target: 'https://mcp.landbase.com/', result: NXDOMAIN}
  - {target: 'npm: landbase, landbase-cli, @landbase/cli, @landbase/sdk, landbase-sdk', result: 404}
  - {target: 'pypi: landbase, landbase-cli, landbase-sdk', result: 404}
  - {target: 'documentation full-text (docs.landbase.com llms-full.txt + 68 sitemap pages)', result: 'no MCP server mentioned'}
  - {target: 'https://cli.landbase.com/latest/skills/ (23 SKILL.md)', result: 'MCP referenced only as a third-party output channel (Google Drive/Sheets)'}
equivalent_agent_surface:
  cli: cli/landbase-cli.yml
  skills: skills/_index.yml
  claude_code_plugin: >-
    `landbase-cli config permissions` installs a Claude Code plugin exposing /landbase-cli:search,
    /landbase-cli:auth and /landbase-cli:setup.
  documented_tool_library: >-
    Landbase documents 19 agent tools at https://www.landbase.com/docs/reference/tools — search
    companies, search contacts, build audience, expand titles, look up company, find company, find
    person, research products, qualify leads, search by meaning, expand lookalikes, scout
    lookalikes, expand industries, discover related industries, analyze patterns, transform data,
    search the web, read webpage, find local businesses. These are the internal tools the Landbase
    agent selects between, described in prose only — no input schemas are published, and they are
    not individually callable, so no tool crosswalk could be derived.
crosswalk: >-
  Not emitted. A ToolCrosswalk binds MCP tools (or GraphQL fields) to backing OpenAPI operationIds;
  Landbase publishes neither side of that mapping.
