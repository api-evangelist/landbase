source: >-
  Negative probes and documentation search on 2026-08-23 — mcp.landbase.com (NXDOMAIN),
  registry.npmjs.org and pypi.org (404 for every landbase name), the full documentation set at
  https://www.landbase.com/docs/, and all 23 published Agent Skills at
  https://cli.landbase.com/latest/skills/.
description: >-
  Landbase ships no MCP server — not a hosted endpoint, not a stdio package, not a candidate. This
  file records that absence deliberately, because Landbase is otherwise one of the more
  agent-forward providers in the catalog and the temptation to read "agent-native" as "has MCP" is
  exactly the error worth writing down. Its agent strategy is a different one: a self-updating CLI
  that emits JSON and stable error codes, plus 23 provider-authored Agent Skills installed into
  Claude Code and Codex. MCP appears in the skills only as something Landbase CONSUMES — the
  prospect-builder, qualify-leads, query-assist and list-similarity-check skills call a Google
  Drive/Sheets MCP server to deliver output. No `MCPServer` pointer is emitted in apis.yml, because
  there is no server to point at.
status: none
