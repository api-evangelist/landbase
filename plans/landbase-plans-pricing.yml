coverage_note: >-
  Contact enrichment is routed through 20+ providers automatically, powered by BetterContact, with
  Bouncer used for email verification — Landbase names its subprocessors on the pricing page.
api_access_gating: >-
  None. Programmatic access via landbase-cli is available on the free tier — the pricing page's own
  comparison makes ungated programmatic access the headline differentiator.
