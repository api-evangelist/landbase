source: https://www.landbase.com/pricing
description: >-
  Landbase publishes real, self-serve, per-tier prices — unusual for B2B data, and it says so
  explicitly on the page ("Apollo gates programmatic access at $357/mo minimum, ZoomInfo & 6Sense
  require annual contracts"). Pricing is a credit bundle: you buy a monthly pool of credits at a
  volume-discounted unit rate and spend them per action. Search and lookalike expansion cost
  nothing; only delivered, verified results are billed, and an unverified result ("miss") is never
  charged. A free tier of 1,000 credits requires no credit card.
docs: https://www.landbase.com/pricing
currency: USD
model: credit-bundle subscription with usage-priced actions
billing_period: monthly
free_tier:
  credits: 1000
  price: 0
  credit_card_required: false
  expiry: none stated
  note: >-
    The pricing page states 1,000 free credits in two places and "$49 free credits" in the sign-up
    callout and CLI demo strip; the two figures are consistent at the $0.033 headline rate
    (1,000 x $0.033 = $33) only loosely, and Landbase does not reconcile them.
